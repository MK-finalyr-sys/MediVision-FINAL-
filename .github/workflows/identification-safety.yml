name: Safe medicine identification regression tests

on:
  push:
    branches:
      - fix/safe-generic-ocr-identification-2026-11-16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        working-directory: medivision-backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python source
        working-directory: medivision-backend
        run: python -m compileall -q app test_visible_ingredient_guard.py test_verification_gate.py test_vision_ocr.py test_online_search_candidate.py
      - name: Exact ingredient and conflict regression suite
        working-directory: medivision-backend
        env:
          PYTHON_DOTENV_DISABLED: '1'
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
        run: python -m unittest test_visible_ingredient_guard -v
      - name: Original verification safety suite
        working-directory: medivision-backend
        env:
          PYTHON_DOTENV_DISABLED: '1'
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
        run: python -m unittest test_verification_gate -v
      - name: Multimodal OCR rescue tests without network
        working-directory: medivision-backend
        env:
          PYTHON_DOTENV_DISABLED: '1'
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
        run: python -m unittest test_vision_ocr -v
      - name: Out-of-catalog online search safety tests (mocked retrieval)
        working-directory: medivision-backend
        env:
          PYTHON_DOTENV_DISABLED: '1'
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
        run: python -m unittest test_online_search_candidate -v
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
